name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    container: python:3.13-slim-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Standard-library tests
        run: python3 -I -m unittest discover -s tests -t . -v
      - name: Offline demo
        run: |
          python3 -m sqlite_migration_rehearsal demo
          python3 -m sqlite_migration_rehearsal demo --json
  installation:
    runs-on: ubuntu-latest
    container: python:3.13-slim-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare isolated installation using real build tooling
        run: |
          python3 -m venv /tmp/rehearsal-install
          /tmp/rehearsal-install/bin/python -m pip install .
      - name: Installed package demo outside the checkout
        working-directory: /tmp
        run: /tmp/rehearsal-install/bin/python -I -m sqlite_migration_rehearsal demo --json
