name: SQLite runtime checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare checksum-pinned SQLite runtime
        run: docker build --tag sqlite-migration-rehearsal-lab-ci .
        timeout-minutes: 5
      - name: Qualify linked SQLite and FTS5
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 2 --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m sqlite-migration-rehearsal-lab-ci python3 tools/qualify_sqlite.py
      - name: Standard-library regression and adversarial tests
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 2 --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m sqlite-migration-rehearsal-lab-ci python3 -I -m unittest discover -s tests -t . -v
      - name: Offline demos
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 2 --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m sqlite-migration-rehearsal-lab-ci python3 -m sqlite_migration_rehearsal demo
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 2 --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m sqlite-migration-rehearsal-lab-ci python3 -m sqlite_migration_rehearsal demo --json
      - name: Install package into an isolated virtualenv
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 2 --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m sqlite-migration-rehearsal-lab-ci sh -euc '
            cp -R /app /tmp/source
            python3 -m venv /tmp/rehearsal-install
            /tmp/rehearsal-install/bin/python -m pip --isolated install --index-url https://pypi.org/simple /tmp/source
            cd /tmp
            /tmp/rehearsal-install/bin/python -I -m sqlite_migration_rehearsal demo --json
          '
        timeout-minutes: 3
